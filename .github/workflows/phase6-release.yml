name: Approval Autopsy release identity lab
on:
  workflow_call:
permissions: {}
jobs:
  verify:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - run: python phase7_client.py release
        env:
          AUTOPSY_PHASE7_URL: ${{ vars.AUTOPSY_PHASE7_URL }}



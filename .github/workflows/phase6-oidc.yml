name: Approval Autopsy live identity lab
on:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    if: ${{ vars.AUTOPSY_ENABLE_OIDC_LAB == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - run: python oidc_probe.py build
        env:
          AUTOPSY_POLICY: ${{ vars.AUTOPSY_POLICY }}
  release-identity:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/phase6-release.yml


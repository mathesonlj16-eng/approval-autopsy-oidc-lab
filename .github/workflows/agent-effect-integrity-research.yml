name: Agent Effect Integrity - pinned upstream conformance
on:
  push:
    branches:
      - research/agent-effect-integrity-2026-11-22
    paths:
      - "research/agent-effect-integrity/**"
      - "research-patches/approval-atomicity/**"
      - "research-patches/sqlite-multiprocess/**"
      - ".github/workflows/agent-effect-integrity-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-effect-integrity-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: microsoft/agent-governance-toolkit
          ref: f85abe1fffc5aaeed716a94bd6654677329215b9
          path: upstream
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test runner
        run: python -m pip install pytest 'pydantic>=2,<3' 'PyYAML>=6,<7' ruff==0.17.4
      - name: Verify upstream revision and source-only import
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p research-results
          git -C upstream rev-parse HEAD | tee research-results/upstream-commit.txt
          test "$(git -C upstream rev-parse HEAD)" = "f85abe1fffc5aaeed716a94bd6654677329215b9"
          python - <<'PY'
          import sys
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          module = install()
          assert hasattr(module, "ApprovalCoordinator")
          PY
          python -m pip freeze > research-results/pip-freeze.txt
      - name: Run protocol, effect-adapter, and concurrent-vote research probes
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/external-tests.log
          import sys, unittest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          suite = unittest.defaultTestLoader.discover("research/agent-effect-integrity", pattern="test_*.py")
          count = suite.countTestCases()
          print(f"Discovered {count} target tests", flush=True)
          if count != 14:
              raise SystemExit(f"Expected exactly 14 tests, got {count}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run original upstream protocol tests for control
        shell: bash
        run: |
          set -o pipefail
          cp upstream/agent-governance-python/agent-mesh/tests/test_approval_protocol.py "${RUNNER_TEMP}/test_approval_protocol.py"
          sha256sum "${RUNNER_TEMP}/test_approval_protocol.py" | tee research-results/upstream-control-hash.txt
          python - <<'PY' 2>&1 | tee research-results/upstream-controls.log
          import os, sys, pytest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          sys.exit(pytest.main(["-q", "--tb=short", os.path.join(os.environ["RUNNER_TEMP"], "test_approval_protocol.py")]))
          PY
      - name: Prove regression fails on unmodified upstream source
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/unpatched-regression.log
          import sys, unittest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          suite = unittest.defaultTestLoader.discover("research-patches/approval-atomicity", pattern="test_atomicity_regression.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 3 or len(result.failures) != 2 or result.errors:
              raise SystemExit("Expected exactly two prepatch concurrent-vote assertion failures and one passing control")
          if any("chain_tampered" not in trace for _, trace in result.failures):
              raise SystemExit("Prepatch failures were not the expected chain_tampered outcomes")
          print("Baseline verified: both concurrent-vote variants fail with chain_tampered; sequential control passes", flush=True)
          PY
      - name: Run original SQLite cross-process trials
        shell: bash
        run: |
          set -o pipefail
          python research-patches/sqlite-multiprocess/run_cross_process.py original 2>&1 | tee research-results/sqlite-original.log
      - name: Run original process-crash rollback trial
        shell: bash
        run: |
          set -o pipefail
          python research-patches/sqlite-multiprocess/run_crash_recovery.py original 2>&1 | tee research-results/sqlite-crash-original.log
      - name: Apply minimal transaction patch only to ephemeral upstream checkout
        shell: bash
        run: |
          set -e -o pipefail
          python research-patches/approval-atomicity/apply_compatible_patch.py
          git -C upstream diff -- agent-governance-python/agent-mesh/src/agentmesh/governance/approval_protocol > research-results/approval-atomicity-prototype.diff
          test -s research-results/approval-atomicity-prototype.diff
          python -m compileall -q upstream/agent-governance-python/agent-mesh/src/agentmesh/governance/approval_protocol
      - name: Run regression against patched upstream code
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/patched-regression.log
          import sys, unittest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          suite = unittest.defaultTestLoader.discover("research-patches/approval-atomicity", pattern="test_atomicity_regression.py")
          if suite.countTestCases() != 3:
              raise SystemExit("Did not collect exactly three atomicity regression tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run patched SQLite cross-process trials
        shell: bash
        run: |
          set -o pipefail
          python research-patches/sqlite-multiprocess/run_cross_process.py patched 2>&1 | tee research-results/sqlite-patched.log
      - name: Run patched process-crash rollback trial
        shell: bash
        run: |
          set -o pipefail
          python research-patches/sqlite-multiprocess/run_crash_recovery.py patched 2>&1 | tee research-results/sqlite-crash-patched.log
      - name: Run existing protocol and effect adapter tests against patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/patched-existing-tests.log
          import sys, unittest
          sys.path.insert(0, "research-support")
          sys.path.insert(0, "research/agent-effect-integrity")
          from agentmesh_protocol_bootstrap import install
          install()
          suite = unittest.defaultTestLoader.loadTestsFromNames(["test_agentmesh_target", "test_sqlite_effect_integration"])
          if suite.countTestCases() != 12:
              raise SystemExit("Expected 12 unchanged baseline/effect-adapter cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run unchanged upstream protocol suite against patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/patched-upstream-tests.log
          import os, sys, pytest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          sys.exit(pytest.main(["-q", "--tb=short", os.path.join(os.environ["RUNNER_TEMP"], "test_approval_protocol.py")]))
          PY
      - name: Verify compatible store migration and high-level govern integration
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/patched-compatibility-and-govern.log
          import sys, unittest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          suite = unittest.defaultTestLoader.discover("research-patches/approval-atomicity", pattern="test_*.py")
          count = suite.countTestCases()
          if count != 21:
              raise SystemExit(f"Expected 21 compatibility, edge, govern and regression tests, discovered {count}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Verify durable expiry resolution on research SQLite store
        shell: bash
        run: |
          set -o pipefail
          python research-patches/sqlite-multiprocess/run_durable_expiry.py 2>&1 | tee research-results/sqlite-durable-expiry.log
      - name: Lint and format-check candidate upstream source
        shell: bash
        run: |
          set -o pipefail
          ruff check upstream/agent-governance-python/agent-mesh/src/agentmesh/governance/approval_protocol/{coordinator.py,store.py,__init__.py} 2>&1 | tee research-results/ruff-check.log
          ruff format --check upstream/agent-governance-python/agent-mesh/src/agentmesh/governance/approval_protocol/{coordinator.py,store.py,__init__.py} 2>&1 | tee research-results/ruff-format.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-effect-integrity-conformance
          path: research-results/
          if-no-files-found: warn
          retention-days: 14

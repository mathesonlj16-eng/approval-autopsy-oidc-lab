name: Agent Effect Integrity - pinned upstream conformance
on:
  push:
    branches:
      - research/agent-effect-integrity-2026-11-22
    paths:
      - "research/agent-effect-integrity/**"
      - ".github/workflows/agent-effect-integrity-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-effect-integrity-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: microsoft/agent-governance-toolkit
          ref: f85abe1fffc5aaeed716a94bd6654677329215b9
          path: upstream
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documented upstream core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./upstream/agent-governance-python/agent-governance-toolkit-core
      - name: Verify exact upstream source and import
        run: |
          mkdir -p research-results
          git -C upstream rev-parse HEAD | tee research-results/upstream-commit.txt
          test "$(git -C upstream rev-parse HEAD)" = "f85abe1fffc5aaeed716a94bd6654677329215b9"
          python -c "from agentmesh.governance.approval_protocol import ApprovalCoordinator; print('Upstream approval protocol imported successfully')"
          python -m pip freeze > research-results/pip-freeze.txt
      - name: Run three synthetic external tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s research/agent-effect-integrity -p "test_*.py" -v 2>&1 | tee research-results/external-tests.log
      - name: Run upstream protocol tests for a control
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q upstream/agent-governance-python/agent-mesh/tests/test_approval_protocol.py 2>&1 | tee research-results/upstream-controls.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-effect-integrity-conformance
          path: research-results/
          if-no-files-found: warn
          retention-days: 14

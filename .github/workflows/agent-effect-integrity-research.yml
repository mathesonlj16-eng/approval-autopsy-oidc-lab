name: Agent Effect Integrity - pinned upstream conformance
on:
  push:
    branches:
      - research/agent-effect-integrity-2026-11-22
    paths:
      - "research/agent-effect-integrity/**"
      - ".github/workflows/agent-effect-integrity-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-effect-integrity-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: microsoft/agent-governance-toolkit
          ref: f85abe1fffc5aaeed716a94bd6654677329215b9
          path: upstream
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test runner
        run: python -m pip install pytest
      - name: Verify upstream revision and source-only import
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p research-results
          git -C upstream rev-parse HEAD | tee research-results/upstream-commit.txt
          test "$(git -C upstream rev-parse HEAD)" = "f85abe1fffc5aaeed716a94bd6654677329215b9"
          python - <<'PY'
          import sys
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          module = install()
          assert hasattr(module, "ApprovalCoordinator")
          PY
          python -m pip freeze > research-results/pip-freeze.txt
      - name: Run pinned-source protocol and SQLite effect integration probes
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee research-results/external-tests.log
          import sys, unittest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          suite = unittest.defaultTestLoader.discover("research/agent-effect-integrity", pattern="test_*.py")
          count = suite.countTestCases()
          print(f"Discovered {count} target tests", flush=True)
          if count != 12:
              raise SystemExit(f"Expected exactly 12 tests, got {count}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run original upstream protocol tests for control
        shell: bash
        run: |
          set -o pipefail
          cp upstream/agent-governance-python/agent-mesh/tests/test_approval_protocol.py "${RUNNER_TEMP}/test_approval_protocol.py"
          sha256sum "${RUNNER_TEMP}/test_approval_protocol.py" | tee research-results/upstream-control-hash.txt
          python - <<'PY' 2>&1 | tee research-results/upstream-controls.log
          import os, sys, pytest
          sys.path.insert(0, "research-support")
          from agentmesh_protocol_bootstrap import install
          install()
          sys.exit(pytest.main(["-q", "--tb=short", os.path.join(os.environ["RUNNER_TEMP"], "test_approval_protocol.py")]))
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-effect-integrity-conformance
          path: research-results/
          if-no-files-found: warn
          retention-days: 14
